<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matrices &amp; Rank — 50 Question Quiz</title>
<style>
:root{
  --bg:#0f1b2d; --card:#152742; --ink:#eef2f8; --sub:#93a5c4;
  --accent:#f2b84b; --good:#3ecf8e; --bad:#ef5b5b; --line:#26395c; --yt:#ff3b30;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f4ef; --card:#ffffff; --ink:#1b2436; --sub:#5b6478;
    --accent:#b5792c; --good:#1f9d63; --bad:#c94343; --line:#e2e0d6;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1b2d; --card:#152742; --ink:#eef2f8; --sub:#93a5c4;
  --accent:#f2b84b; --good:#3ecf8e; --bad:#ef5b5b; --line:#26395c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  display:flex; justify-content:center; padding:0 14px 40px;
}
.wrap{width:100%; max-width:640px;}
a.bannerlink{display:block; margin:14px 0 0; border-radius:14px; overflow:hidden; border:1px solid var(--line); line-height:0;}
a.bannerlink img{width:100%; display:block;}
.chanrow{display:flex; align-items:center; gap:12px; margin:12px 0 18px; font-family:-apple-system,Helvetica,Arial,sans-serif;}
.chanrow img.logo{width:46px; height:46px; border-radius:50%; border:1px solid var(--line); flex-shrink:0;}
.channame{flex:1; min-width:0;}
.channame .n1{font-weight:700; font-size:.95rem; color:var(--ink);}
.channame .n2{font-size:.78rem; color:var(--sub);}
.ytbtn{display:flex; align-items:center; gap:6px; background:var(--yt); color:#fff; text-decoration:none; padding:8px 12px; border-radius:8px; font-size:.82rem; font-weight:600; flex-shrink:0; white-space:nowrap;}
.ytbtn svg{width:16px; height:16px; fill:#fff;}
h1{font-size:1.4rem; margin:0 0 4px; font-weight:600; letter-spacing:.2px;}
.sub{color:var(--sub); font-size:.92rem; font-family:-apple-system,Helvetica,Arial,sans-serif;}
.bar{height:6px; background:var(--line); border-radius:3px; margin:16px 0 10px; overflow:hidden;}
.bar>div{height:100%; background:var(--accent); width:0%; transition:width .3s;}
.statrow{display:flex; gap:8px; margin-bottom:12px; font-family:-apple-system,Helvetica,Arial,sans-serif;}
.stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 6px; text-align:center;}
.stat .v{font-size:1.15rem; font-weight:700;}
.stat .l{font-size:.68rem; color:var(--sub); text-transform:uppercase; letter-spacing:.04em;}
.stat.good .v{color:var(--good);} .stat.bad .v{color:var(--bad);} .stat.acc .v{color:var(--accent);}
.jumpbtn{display:block; width:100%; text-align:center; padding:9px; margin-bottom:10px; background:var(--card); border:1px solid var(--line); border-radius:9px; color:var(--sub); font-family:-apple-system,Helvetica,Arial,sans-serif; font-size:.85rem; cursor:pointer;}
.jumpgrid{display:none; flex-wrap:wrap; gap:6px; margin-bottom:14px; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:9px;}
.jumpgrid.show{display:flex;}
.jbtn{width:32px; height:32px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-family:-apple-system,Helvetica,Arial,sans-serif; font-size:.78rem; cursor:pointer;}
.jbtn.cur{border-color:var(--accent); border-width:2px;}
.jbtn.ok{background:rgba(62,207,142,.18); border-color:var(--good); color:var(--good);}
.jbtn.no{background:rgba(239,91,91,.18); border-color:var(--bad); color:var(--bad);}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 20px;}
.qnum{font-family:-apple-system,Helvetica,Arial,sans-serif; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin-bottom:8px;}
.qtext{font-size:1.2rem; line-height:1.6; margin-bottom:18px;}
.opt{
  display:flex; align-items:center; width:100%; text-align:left; padding:13px 14px; margin-bottom:10px;
  background:transparent; border:1.5px solid var(--line); border-radius:9px;
  color:var(--ink); font:inherit; font-size:1.08rem; cursor:pointer; transition:border-color .15s,background .15s;
}
.opt:hover:not(:disabled){border-color:var(--accent);}
.opt:disabled{cursor:default;}
.opt.correct{border-color:var(--good); background:rgba(62,207,142,.12);}
.opt.wrong{border-color:var(--bad); background:rgba(239,91,91,.12);}
.steps{
  display:none; margin-top:14px; padding:14px 16px; background:var(--bg);
  border-left:3px solid var(--accent); border-radius:0 8px 8px 0;
  font-family:-apple-system,Helvetica,Arial,sans-serif; font-size:.96rem; line-height:1.7; color:var(--sub);
}
.steps.show{display:block;}
.steps b{color:var(--ink); font-weight:700;}
.nav{display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-family:-apple-system,Helvetica,Arial,sans-serif;}
button.nav-btn{
  padding:10px 18px; border-radius:8px; border:1px solid var(--line); background:var(--card);
  color:var(--ink); font-size:.92rem; cursor:pointer;
}
button.nav-btn:disabled{opacity:.35; cursor:default;}
button.primary{background:var(--accent); border-color:var(--accent); color:#1b1204; font-weight:600;}
.result{text-align:center; padding:30px 10px;}
.result .score{font-size:2.6rem; color:var(--accent); margin:8px 0;}
.catrow{display:flex; justify-content:space-between; font-family:-apple-system,Helvetica,Arial,sans-serif; font-size:.85rem; padding:7px 4px; border-bottom:1px solid var(--line); text-align:left;}
.catrow:last-child{border-bottom:none;}
#app{outline:none;}
sup{font-size:.68em; line-height:0; position:relative; top:-.55em; margin-left:.03em;}
.frac{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 3px; font-size:.94em; line-height:1.15; position:relative; top:.08em;}
.frac .num{padding:0 4px 2px; border-bottom:1.4px solid currentColor;}
.frac .den{padding:2px 4px 0;}
</style>
</head>

const Q = [{"c": "Symmetric & Skew-Symmetric Matrices", "q": "A square matrix A is called symmetric if:", "o": ["A^[T] = A", "A^[T] = -A", "A^[T] = A^[-1]", "A^[2] = A"], "a": 0, "s": "By definition, a matrix A is <b>symmetric</b> if it equals its own transpose: A^[T] = A."}, {"c": "Symmetric & Skew-Symmetric Matrices", "q": "A square matrix A is called skew-symmetric if:", "o": ["A^[T] = -A", "A^[T] = A", "A^[T] = A^[-1]", "A^[2] = -A"], "a": 0, "s": "By definition, A is <b>skew-symmetric</b> if A^[T] = -A."}, {"c": "Symmetric & Skew-Symmetric Matrices", "q": "For a skew-symmetric matrix, the diagonal elements are always:", "o": ["zero", "1", "real but non-zero", "equal to each other"], "a": 0, "s": "If A^[T]=-A, then a_ii = -a_ii for each diagonal entry, which forces <b>a_ii = 0</b>."}, {"c": "Symmetric & Skew-Symmetric Matrices", "q": "Every square matrix A can be expressed as the sum of a symmetric and a skew-symmetric matrix, given by:", "o": ["A = \\f{1}{2}(A+A^[T]) + \\f{1}{2}(A-A^[T])", "A = (A+A^[T]) + (A-A^[T])", "A = \\f{1}{2}(A+A^[T]) - \\f{1}{2}(A-A^[T])", "A = A^[T] + A"], "a": 0, "s": "Splitting: A = <b>\\f{1}{2}(A+A^[T]) + \\f{1}{2}(A-A^[T])</b>, where the first part is symmetric and the second is skew-symmetric."}, {"c": "Symmetric & Skew-Symmetric Matrices", "q": "The matrix \\f{1}{2}(A+A^[T]) is always:", "o": ["symmetric", "skew-symmetric", "Hermitian", "orthogonal"], "a": 0, "s": "Its transpose is \\f{1}{2}(A^[T]+A), which is the same matrix, so it is <b>symmetric</b>."}, {"c": "Symmetric & Skew-Symmetric Matrices", "q": "For any real square matrix A, the matrix AA^[T] is always:", "o": ["symmetric", "skew-symmetric", "skew-Hermitian", "never symmetric"], "a": 0, "s": "(AA^[T])^[T] = (A^[T])^[T]A^[T] = AA^[T], so it equals its own transpose — <b>symmetric</b>."}, {"c": "Symmetric & Skew-Symmetric Matrices", "q": "The determinant of a skew-symmetric matrix of odd order is:", "o": ["0", "1", "-1", "always positive"], "a": 0, "s": "For odd order n, e matrix A can be expressed as the sum of a Hermitian and a skew-Hermitian matrix, given by:", "o": ["A = \\f{1}{2}(A+A^[θ]) + \\f{1}{2}(A-A^[θ])", "A = (A+A^[θ]) + (A-A^[θ])", "A = \\f{1}{2}(A+A^[θ]) - \\f{1}{2}(A-A^[θ])", "A = A^[θ] + A"], "a": 0, "s": "Splitting: A = <b>\\f{1}{2}(A+A^[θ]) + \\f{1}{2}(A-A^[θ])</b>, the first part Hermitian and the second skew-Hermitian."}, {"c": "Hermitian & Skew-Hermitian Matrices", "q": "If A is a skew-Hermitian matrix, then iA (i=√-1) is:", "o": ["Hermitian", "skew-Hermitian", "orthogonal", "unitary"], "a": 0, "s": "(iA)^[θ] = -i·A^[θ] = -i(-A) = iA, so iA equals its own conjugate transpose — <b>Hermitian</b>."}, {"c": "Hermitian & Skew-Hermitian Matrices", "q": "For any square matrix A, the matrix AA^[θ] is always:", "o": ["Hermitian", "skew-Hermitian", "unitary", "orthogonal"], "a": 0, "s": "(AA^[θ])^[θ] = (A^[θ])^[θ]A^[θ] = AA^[θ], so it equals its own conjugate transpose — <b>Hermitian</b>."}, {"c": "Unitary Matrices", "q": "A square matrix A is called unitary if:", "o": ["AA^[θ] = A^[θ]A = I", "AA^[θ] = 0", "A^[θ] = A", "AA^[T] = -I"], "a": 0, "s": "By definition, A is <b>unitary</b> if AA^[θ] = A^[θ]A = I, i.e. A^[θ] = A^[-1]."}, {"c": "Unitary Matrices", "q": "For a unitary matrix A, the relationship between A^[θ] and A^[-1] is:", "o": ["A^[θ] = A^[-1]", "A^[θ] = A", "A^[θ] = -A^[-1]", "A^[θ] = A^[2]"], "a": 0, "s": "Since AA^[θ]=I, multiplying both sides by A^[-1] gives <b>A^[θ] = A^[-1]</b>."}, {"c": "Unitary Matrices", "q": "The modulus of the determinant of a unitary matrix is:", "o": ["1", "0", "-1", "not always defined"], "a": 0, "s": "From AA^[θ]=I: det(A)det(A^[θ])=1, and det(A^[θ])=conjugate(det A), so |det A|^[2]=1, giving <b>|det A| = 1</b>."}, {"c": "Unitary Matrices", "q": "If A is a real unitary matrix, then A is also:", "o": ["orthogonal", "skew-symmetric", "Hermitian", "skew-Hermitian"], "a": 0, "s": "For a real matrix, A^[θ]=A^[T], so AA^[θ]=I becomes AA^[T]=I — the definition of an <b>orthogonal</b> mat  A only", "the inverse of A", "the adjoint (classical adjugate) of A"], "a": 0, "s": "A^[θ] (also written A*) is <b>the conjugate transpose</b>: take the complex conjugate of each entry, then transpose."}, {"c": "Properties of Matrices", "q": "For a scalar k and a square matrix A of order n, det(kA) equals:", "o": ["k^[n]det(A)", "k·det(A)", "det(A)", "k^[2]det(A)"], "a": 0, "s": "Each of the n rows is scaled by k, so <b>det(kA) = k^[n]det(A)</b>."}, {"c": "Rank of a Matrix (Echelon Form)", "q": "The rank of a matrix A is defined as:", "o": ["the number of non-zero rows in its row echelon form", "the number of rows in A", "the number of columns in A", "the value of det(A)"], "a": 0, "s": "The <b>rank</b> of A equals the number of non-zero rows when A is reduced to row echelon form (equivalently, the order of the largest non-vanishing minor)."}, {"c": "Rank of a Matrix (Echelon Form)", "q": "In row echelon form, the leading (pivot) entry of each non-zero row is:", "o": ["strictly to the right of the leading entry of the row above it", "strictly to the left of the leading entry of the row above it", "always in the first column", "always equal to zero"], "a": 0, "s": "Row echelon form requires each pivot to be <b>strictly to the right</b> of the pivot in the row above, with all-zero rows at the bottom."}, {"c": "Rank of a Matrix (Echelon Form)", "q": "The rank of the identity matrix I of order n is:", "o": ["n", "n-1", "1", "0"], "a": 0, "s": "I is already in echelon form with n non-zero rows, so its rank is <b>n</b>."}, {"c": "Rank of a Matrix (Echelon Form)", "q": "The rank of the zero matrix (of any order) is:", "o": ["0", "1", "equal to its order n", "undefined"], "a": 0, "s": "A zero matrix has no non-zero rows in echelon form, so its rank is <b>0</b>."}, {"c": "Rank of a Matrix (Echelon Form)", "q": "For an m×n matrix A, the rank of A can never exceed:", "o": ["min(m, n)", "max(m, n)", "m+n", "mn"], "a": 0, "s": "The number of non-zero rows in echelon form cannot exceed either the row count or column count, so rank(A) ≤ <b>min(m, n)</b>."}, {"c": "Rank of a Matrix (Echelon Form)", "q": "A square matrix of order n is called non-singular (invertible) if its rank is:", "o": ["n (full rank)", "less than n", "0", "1"], "a": 0, "s": "A square matrix is invertible exactly when it has <b>full rank n</b> — no row becomes all zero after reduction."}, {"c": "Rank of a Matrix (Echelon Form)", "q": "To reduce a matrix to row echelon form, the elementary operations allowed are:", "o": ["row swap, scaling a row by a non-zero constant, and adding a multiple of one row to another", "swapping rows and columns freely", "multiplying a row by zero", "only adding rows, with no scaling or swapping"], "a": 0, "s": "Row echelon reduction uses the three <b>elementary row operations</b>: swap, scale (by a non-zero constant), and row addition."}, {"c": "Rank of a Matrix (Echelon Form)", "q": "If, after row reduction, a matrix has exactly 2 non-zero rows, its rank is:", "o": ["2", "the number of columns", "the number of zero rows", "1"], "a": 0, "s": "Rank equals the count of non-zero rows in echelon form, so here <b>rank = 2</b>."}, {"c": "Normal Form & PAQ Form", "q": "Every matrix A of rank r can be reduced, by a sequence of elementary row and column operations, to the normal form:", "o": ["[[I_r, 0],[0, 0]]", "[[I_r, 0]]", "the identity matrix always", "a diagonal matrix with distinct entries"], "a": 0, "s": "Any matrix of rank r reduces to the block form <b>[[I_r, 0],[0, 0]]</b>, called its normal (or canonical) form."}, {"c": "Normal Form & PAQ Form", "q": "In the PAQ form, P and Q represent:", "o": ["invertible matrices obtained as products of elementary row and column operations respectively", "the original matrix's rows and columns unchanged", "two copies of the identity matrix", "diagonal scaling matrices only"], "a": 0, "s": "P is the product of elementary <b>row</b>-operation matrices and Q is the product of elementary <b>column</b>-operati function shuffleOptions(item){
  const correctText = item.o[item.a];
  for(let i=item.o.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [item.o[i],item.o[j]]=[item.o[j],item.o[i]];
  }
  item.a = item.o.indexOf(correctText);
}
Q.forEach(shuffleOptions);

let idx=0, score=0, answered=new Array(Q.length).fill(false);

function updateStats(){
  const attempted = answered.filter(Boolean).length;
  const wrong = attempted - score;
  document.getElementById('statAttempt').textContent = attempted+'/'+Q.length;
  document.getElementById('statCorrect').textContent = score;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statPct').textContent = attempted? Math.round(score/attempted*100)+'%':'0%';
}

function buildJumpGrid(){
  const g=document.getElementById('jumpGrid');
  g.innerHTML='';
  Q.forEach((item,i)=>{
    const b=document.createElement('button');
    b.className='jbtn'+(i===idx?' cur':'')+(answered[i]?(item.picked===item.a?' ok':' no'):'');
    b.textContent=i+1;
    b.onclick=()=>{ idx=i; render(); document.getElementById('jumpGrid').classList.remove('show'); };
    g.appendChild(b);
  });
}
document.getElementById('jumpToggle').onclick=()=>{
  buildJumpGrid();
  document.getElementById('jumpGrid').classList.toggle('show');
};

function render(){
  const item=Q[idx];
  document.getElementById('barfill').style.width=((idx)/Q.length*100)+'%';
  updateStats();
  const app=document.getElementById('app');
  app.innerHTML=
    '<div class="qnum">'+item.c+' · Q'+(idx+1)+'/'+Q.length+'</div>'+
    '<div class="qtext">'+fx(item.q)+'</div>'+
    '<div id="opts"></div>'+
    '<div id="steps" class="steps"><b>Solution:</b><br>'+fx(item.s)+'</div>'+
    '<div class="nav">'+
      '<button class="nav-btn" id="prevBtn" '+(idx===0?'disabled':'')+'>Previous</button>'+
      '<button class="nav-btn primary" id="nextBtn" style="display:none">'+(idx===Q.length-1?'See results':'Next question')+'</button>'+
    '</div>';
  const optsDiv=document.getElementById('opts');
  item.o.forEach((text,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.innerHTML=fx(text);
    b.onclick=()=>selectOption(i);
    optsDiv.appendChild(b);
  });
  if(answered[idx]){ lockOptions(item.picked); }
  document.getElementById('prevBtn').onclick=()=>{ if(idx>0){idx--; render();} };
  document.getElementById('nextBtn').onclick=()=>{
    if(idx<Q.length-1){ idx++; render(); } else { showResult(); }
  };
}

function selectOption(i){
  const item=Q[idx];
  if(answered[idx]) return;
  answered[idx]=true;
  item.picked=i;
  if(i===item.a) score++;
  lockOptions(i);
}

function lockOptions(picked){
  const item=Q[idx];
  const btns=document.querySelectorAll('#opts .opt');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===item.a) b.classList.add('correct');
    else if(i===picked) b.classList.add('wrong');
  });
  document.getElementById('steps').classList.add('show');
  document.getElementById('nextBtn').style.display='inline-block';
  updateStats();
}

function showResult(){
  document.getElementById('barfill').style.width='100%';
  const cats={};
  Q.forEach((item,i)=>{
    if(!cats[item.c]) cats[item.c]={correct:0,total:0};
    cats[item.c].total++;
    if(answered[i] && item.picked===item.a) cats[item.c].correct++;
  });
  let catHtml='';
  Object.keys(cats).forEach(c=>{
    catHtml+='<div class="catrow"><span>'+c+'</span><span>'+cats[c].correct+' / '+cats[c].total+'</span></div>';
  });
  document.getElementById('app').innerHTML=
    '<div class="result">'+
      '<div class="qnum" style="text-align:center">Test complete</div>'+
      '<div class="score">'+score+' / '+Q.length+'</div>'+
      '<div class="sub" style="margin-bottom:16px">'+Math.round(score/Q.length*100)+'% correct</div>'+
      '<div style="text-align:left; margin-bottom:20px">'+catHtml+'</div>'+
      '<button class="nav-btn primary" id="restartBtn">Restart test</button>'+
    '</div>';
  document.getElementById('restartBtn').onclick=()=>{
    idx=0; score=0; answered=new Array(Q.length).fill(false);
    Q.forEach(q=>delete q.picked);
    render();
  };
}

render();
</script>
</body>
